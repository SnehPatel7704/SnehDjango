<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(270deg, #0f172a, #131d3e, #1e293b);
            background-size: 600% 600%;
            animation: gradient 16s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="gradient-bg text-gray-200 min-h-screen flex items-center justify-center">

    <div class="main-container text-center p-8 bg-slate-900/70 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl max-w-md w-full">
        <h1 class="text-4xl font-bold text-white mb-3">Welcome!</h1>
        <p class="text-gray-400 mb-8">Please choose a section to continue.</p>
        
        <ul class="space-y-4">
            <li>
                <a href="/movies" class="group block w-full text-left p-5 bg-slate-800/50 hover:bg-slate-700/80 border border-white/10 rounded-lg transition-all duration-300 transform hover:scale-105">
                    <h2 class="text-xl font-semibold text-white">Movies</h2>
                    <p class="text-sm text-gray-400 mt-1">Browse our movie collection.</p>
                </a>
            </li>
            <li>
                <a href="/robo" class="group block w-full text-left p-5 bg-slate-800/50 hover:bg-slate-700/80 border border-white/10 rounded-lg transition-all duration-300 transform hover:scale-105">
                    <h2 class="text-xl font-semibold text-white">Robo</h2>
                    <p class="text-sm text-gray-400 mt-1">Interact with our Robo assistant.</p>
                </a>
            </li>
            <li>
                <a href="/ChatMCA" class="group block w-full text-left p-5 bg-slate-800/50 hover:bg-slate-700/80 border border-white/10 rounded-lg transition-all duration-300 transform hover:scale-105">
                    <h2 class="text-xl font-semibold text-white">ChatMCA</h2>
                    <p class="text-sm text-indigo-200 mt-1">Launch the intelligent chat experience.</p>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
