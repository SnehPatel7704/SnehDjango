<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo Friends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(270deg, #0f172a, #131d3e, #1e293b);
            background-size: 600% 600%;
            animation: gradient 16s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="gradient-bg text-gray-200 min-h-screen p-4 sm:p-8">

    <div class="container mx-auto max-w-7xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-bold text-white mb-3">Meet the Bots</h1>
            <a href="/" class="text-indigo-400 hover:text-indigo-300 transition-colors duration-300">&larr; Back to Home</a>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for robot in robots %}
            <div class="card bg-slate-900/70 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden transform hover:-translate-y-2 transition-transform duration-300">
                <div class="p-5 bg-slate-800 flex justify-center items-center">
                    <img
                        src="https://robohash.org/{{ robot.name }}?set=set1&size=180x180"
                        class="rounded-full border-4 border-slate-700"
                        alt="Image of {{ robot.name }}">
                </div>
                <div class="card-body p-5">
                    <h5 class="text-xl font-bold text-white text-center mb-4 truncate">{{ robot.name }}</h5>
                    <div class="text-sm space-y-2 text-gray-400">
                        <p class="truncate"><span class="font-semibold text-gray-300">Email:</span> {{ robot.email }}</p>
                        <p><span class="font-semibold text-gray-300">Age:</span> {{ robot.age }}</p>
                        <p class="truncate"><span class="font-semibold text-gray-300">Location:</span> {{ robot.location }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
