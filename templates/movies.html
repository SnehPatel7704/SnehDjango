<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        .movie-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 15px;
            display: inline-block;
            width: 220px;
            height: 430px;
            text-align: center;
            vertical-align: top;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .movie-card:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        }
        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- <div class="container p-5">
        <h1 class="pl-5"> Movies </h1>
        <p><a href="/">Back to Home</a></p>
    </div> -->
    <div id="movie-list">
        <form method="GET" class="search-form" style="margin-bottom: 30px; text-align: center;">
            <input 
            type="text" 
            name="user_input" 
            placeholder="Search for a movie..." 
            value="{{ query }}"
            style="padding: 8px 14px; border: 1px solid #ccc; border-radius: 4px; width: 220px; font-size: 16px;"
            >
            <button 
            type="submit"
            style="padding: 8px 18px; border: none; border-radius: 4px; background-color: #007bff; color: #fff; font-size: 16px; cursor: pointer; margin-left: 8px;"
            >
            Search
            </button>
        </form>
        {% for movie in movies %}
        <div class="movie-card">
            <h3>{{ movie.name }}</h3>
            <img src="{{ movie.bannerUrl }}" alt="{{ movie.name }}">
            <p><strong>Genre:</strong> {{ movie.genre }}</p>
            <p><strong>Year:</strong> {{ movie.releaseYear }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
